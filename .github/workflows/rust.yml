name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust 1.85
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.85.0
    - name: Check library
      run: |
        cargo check --package ur --lib
        cargo check --package ur --lib --no-default-features

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install crates
      run: |
        cargo install --debug cargo-quickinstall
        cargo quickinstall cargo-sort cargo-rdme cargo-audit cargo-udeps cargo-machete taplo-cli cargo-deny
    - name: Lint
      run: |
        cargo fmt -- --check --config format_code_in_doc_comments=true
        git ls-files | grep ".toml$" | taplo fmt --check
        cargo rdme install-rust-toolchain-for-intralinks
        cargo rdme --check
        cargo sort --workspace --check
        cargo audit -D warnings --ignore RUSTSEC-2025-0141
        cargo deny check licenses
        cargo machete
        cargo clippy --workspace --all --all-targets --all-features -- -Dwarnings -D clippy::pedantic -D clippy::dbg-macro -A clippy::missing-panics-doc -D clippy::nursery
        cargo build --workspace
        cargo test --workspace
        export RUSTC_BOOTSTRAP=1 && cargo udeps && cd fuzz && cargo udeps
